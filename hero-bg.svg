  <path d="M-50 700 Q350 440 560 460 Q740 480 950 400" stroke="#2C5F6E" stroke-width="0.8" opacity="0.06"/>
  <path d="M-50 700 Q400 470 580 480 Q720 490 950 450" stroke="#2C5F6E" stroke-width="0.6" opacity="0.05"/>

