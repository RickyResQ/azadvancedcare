  <line x1="650" y1="0" x2="950" y2="500" stroke="#2C5F6E" stroke-width="0.5" opacity="0.03"/>
  <line x1="700" y1="0" x2="950" y2="420" stroke="#2C5F6E" stroke-width="0.4" opacity="0.03"/>

  <!-- Small dot cluster -->
